[project]
name = "dota2forge-workspace"
version = "0.1.0a3"
description = "Dota2Forge development workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/dota2forge-core", "packages/dota2forge-renderer", "adapters/astrbot_plugin_dota2forge", "adapters/Dota2UID"]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28.1,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pip>=25,<27",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-socket>=0.7,<1",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "adapters", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --disable-socket --cov=scripts --cov=dota2forge_core --cov=dota2forge_renderer --cov=Dota2UID --cov=astrbot_plugin_dota2forge --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["scripts/__init__.py"]
