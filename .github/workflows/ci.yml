name: Dota2Forge CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: offline (${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Install locked workspace
        run: uv sync --locked --all-packages --python "${{ matrix.python }}"
      - name: Full offline checks
        if: github.event_name != 'pull_request'
        run: uv run --locked python scripts/check_governance.py --all
      - name: PR offline checks and decision impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --locked python scripts/check_governance.py --base "$BASE_SHA"
      - name: Build packages
        run: uv build --all-packages
      - name: Install and import wheels without host SDKs
        run: uv run --locked python scripts/smoke_wheels.py
