[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "astrbot-plugin-dota2forge"
version = "0.1.0a1"
description = "Dota2Forge AstrBot adapter with explicit host discovery bridge"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "dota2forge-core>=0.1.0a1,<0.2",
  "dota2forge-renderer>=0.1.0a1,<0.2",
]

[project.optional-dependencies]
stratz = [
  "dota2forge-core[stratz]>=0.1.0a1,<0.2",
  "httpx>=0.28.1,<1",
]

[tool.uv.sources]
dota2forge-core = { workspace = true }
dota2forge-renderer = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/astrbot_plugin_dota2forge"]
